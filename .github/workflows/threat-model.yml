name: threat-model
on: [push, pull_request]
jobs:
  stride:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Dependency audit (SR4)
        run: npm audit --audit-level=high
      - run: npm test
      # The reference model is deliberately insecure, so the gate MUST trip (exit 1).
      # In a real project, run the same command on your own model and let a non-zero exit fail the build.
      - name: STRIDE gate (demo — expects the reference model to fail at Critical)
        run: |
          set +e
          node src/cli.js analyze examples/ecommerce.json --format md --out threat-report.md --fail-on Critical
          code=$?
          echo "stride-engine exit code: $code"
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: threat-report, path: threat-report.md }

name: threat-model
on: [push, pull_request]
jobs:
  stride:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - name: STRIDE gate
        run: node src/cli.js analyze examples/ecommerce.json --format md --out threat-report.md --fail-on Critical
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: threat-report, path: threat-report.md }
